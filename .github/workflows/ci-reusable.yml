# ============================================
# WORKFLOW: CI com Workflows Reutilizáveis
# Demonstra como chamar workflows reutilizáveis
# ============================================
name: 🚀 CI with Reusable Workflows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Test
    uses: ./.github/workflows/reusable-matrix-pytest.yml
    with:
      python-versions: '["3.14.6", "3.13", "3.12"]'

  lint:
    name: 🔍 Lint
    uses: ./.github/workflows/reusable-matrix-lint.yml
    with:
      python-versions: '["3.14.6", "3.13", "3.12"]'

  security:
    name: 🔒 Security
    uses: ./.github/workflows/reusable-matrix-security.yml
    with:
      python-versions: '["3.14.6", "3.13", "3.12"]'

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [test, lint, security]

    steps:
      - name: 🚀 Deploy
        run: echo "Todos os testes passaram! Deploying..."
